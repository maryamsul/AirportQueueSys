# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.Net Core app to Azure Web App - SmartAirport-API
env:
  VITE_API_URL: https://smartairport-api-f2bnc3e6drhdg6gr.koreacentral-01.azurewebsites.net
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore SmartAirport.API/SmartAirport.API/SmartAirport.API.csproj

      - name: Build API
        run: dotnet build SmartAirport.API/SmartAirport.API/SmartAirport.API.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish SmartAirport.API/SmartAirport.API/SmartAirport.API.csproj --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish


  deploy:
    runs-on: windows-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8D5D7C4BBD41418AB8B59611F32A8E2A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_73AA1457DC4C4BABB1B3FE30F5765A5D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AFCC23B987C94A01B5ED33CE6F519BB5 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: SmartAirport-API
          slot-name: Production
          package: .
